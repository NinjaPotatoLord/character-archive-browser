version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: char-archive-db-dev
    environment:
      POSTGRES_DB: char_archive
      POSTGRES_USER: char_archive
      POSTGRES_PASSWORD: char_archive_local
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ../database.dump:/dump/database.dump:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U char_archive -d char_archive"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=256MB
      -c work_mem=32MB
      -c max_connections=50
      -c max_wal_size=2GB
      -c checkpoint_timeout=15min

  db-init:
    image: postgres:14
    container_name: char-archive-db-init-dev
    environment:
      PGPASSWORD: char_archive_local
    volumes:
      - ../database.dump:/dump/database.dump:ro
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: char-archive-backend-dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: char_archive
      DATABASE_USER: char_archive
      DATABASE_PASSWORD: char_archive_local
      ARCHIVE_PATH: /archive
    volumes:
      - ../archive/hashed-data:/archive:ro
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: char-archive-frontend-dev
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 128M